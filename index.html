<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Studio — công cụ PDF ngay trên trình duyệt</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b2130;--mut:#667085;--line:#e2e5eb;--pri:#1f5fd1;--pri2:#e8f0fe;--err:#b42318;--ok:#067647;--warn:#9a6700;--side:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b1f27;--tx:#e8ebf1;--mut:#9aa3b2;--line:#2b313c;--pri:#6ea0ff;--pri2:#1e2a42;--err:#ff8a80;--ok:#6ee7a8;--warn:#f2c14e;--side:#171a21}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100%}
aside{width:260px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:14px 10px;overflow:auto;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:18px;padding:4px 10px 10px}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:12px 10px 4px}
#nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:7px 10px;border-radius:8px;cursor:pointer;font:inherit}
#nav button:hover{background:var(--pri2)}#nav button.on{background:var(--pri);color:#fff}
details.fonts{margin:16px 6px 0;font-size:13px;color:var(--mut)}details.fonts summary{cursor:pointer}details.fonts label{display:block;margin-top:8px}
.foot{margin:16px 10px 0;font-size:12px;color:var(--mut)}
main{flex:1;min-width:0;padding:20px;max-width:1000px}
#panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
h2{margin:0 0 4px;font-size:19px}h3{margin:18px 0 6px;font-size:15px}.hint{color:var(--mut);font-size:13px;margin:0 0 12px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--mut);cursor:pointer}.drop small{display:block}.drop.over,.drop:hover{border-color:var(--pri);background:var(--pri2)}
.flist{margin-top:8px}.fitem{display:flex;gap:8px;align-items:center;padding:4px 8px;border:1px solid var(--line);border-radius:8px;margin-top:4px}.fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opts{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;margin:12px 0}
.opts label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut)}.opts label.chk,label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--tx);font-size:14px}
.opts small{color:var(--mut)}
input[type=text],input[type=number],input[type=password],select,textarea{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit;max-width:100%}
button{font:inherit}button.act{background:var(--pri);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer}button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri);padding:8px 14px;border-radius:8px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}button.ico{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:6px;padding:1px 7px;cursor:pointer}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#statusrow{margin-top:12px}#bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;display:none}#bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .15s}#status{font-size:13px;color:var(--mut);min-height:20px;margin-top:4px}
#results{margin-top:8px}.rhead{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin:12px 0 6px}
.ritem{display:flex;gap:10px;align-items:center;padding:7px 10px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:5px;flex-wrap:wrap}.rname{flex:1;min-width:140px;word-break:break-all}.rsize{color:var(--mut);font-size:12px}.rnote{width:100%;font-size:12px;color:var(--warn)}
.err{color:var(--err);margin-top:6px;font-size:14px}.note{background:var(--pri2);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:14px}
.box{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}th{color:var(--mut);font-size:12px;font-weight:500;position:sticky;top:0;background:var(--card)}td input[type=text]{width:100%}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}.thumb{border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}.thumb.del{opacity:.35}.tbox{height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden}.tbox canvas{max-width:100%;max-height:100%;transition:transform .15s}.tlabel{font-size:12px;margin:4px 0}.tbtn{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.bmwrap{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.bmtable{flex:1 1 520px;min-width:0}.prev{flex:0 0 230px}.prev canvas{max-width:100%;border:1px solid var(--line);border-radius:4px}.bmtools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;align-items:center}details.imp{margin-top:12px}details.imp summary{cursor:pointer;color:var(--pri)}details.imp textarea{margin-top:8px}
.scan{margin-top:10px}.after{margin-top:6px}
#banner{display:none;background:#fff4e5;color:#7a4b00;border:1px solid #ffd59a;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:14px}
@media (max-width:760px){.app{flex-direction:column}aside{width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}#nav{display:flex;flex-wrap:wrap;gap:4px}.grp{width:100%}#nav button{width:auto}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand">PDF Studio</div>
  <div id="nav"></div>
  <details class="fonts"><summary>Cài đặt font tiếng Việt (PDF)</summary>
    <p>Chữ tiếng Việt trong mục lục, watermark, đánh số trang, Word→PDF cần font Unicode. App tự tải font Tinos; nếu mạng chặn, chọn file .ttf trên máy (vd <code>C:\Windows\Fonts\times.ttf</code>).</p>
    <label>Thường <input type="file" id="fontfile" accept=".ttf,.otf"></label>
    <label>Đậm (tùy chọn) <input type="file" id="fontbold" accept=".ttf,.otf"></label><div id="fontinfo"></div>
  </details>
  <div class="foot">Mọi thao tác chạy ngay trong trình duyệt — file không được gửi đi đâu.</div>
</aside>
<main>
  <div id="banner"></div>
  <div id="panel"></div>
  <div id="statusrow"><div id="bar"><i></i></div><div id="status"></div></div>
  <div id="results"></div>
</main>
</div>
<script>
window.PS = {};
PS.CDN = {
  pdfjs: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/',
  qpdf: 'https://cdn.jsdelivr.net/npm/@neslinesli93/qpdf-wasm@0.3.0/dist/',
  fonts: ['https://cdn.jsdelivr.net/gh/google/fonts@2796410152d4f9524b68ed46e69c1b60f8e0f7c3/ofl/tinos/', 'https://raw.githubusercontent.com/google/fonts/2796410152d4f9524b68ed46e69c1b60f8e0f7c3/ofl/tinos/']
};
function loadScript(urls) {
  return new Promise(function (res, rej) {
    var i = 0;
    (function next() {
      if (i >= urls.length) return rej(new Error('Không tải được ' + urls[0]));
      var s = document.createElement('script'); s.src = urls[i++]; s.onload = res; s.onerror = function () { s.remove(); next(); };
      document.head.appendChild(s);
    })();
  });
}
PS.libsReady = Promise.all([
  loadScript(['https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js', 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js']),
  loadScript(['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'])
]).then(function () {
  return loadScript(['https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js', 'https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js']).catch(function () { /* không có fontkit: PDF sẽ dùng chữ không dấu */ });
}).catch(function (e) {
  var b = document.getElementById('banner'); b.style.display = 'block'; b.textContent = 'Không tải được thư viện cần thiết (' + e.message + '). Kiểm tra kết nối mạng rồi tải lại trang.'; throw e;
});
</script>
<script>
/* ===== 01-core: tiện ích, trích xuất chữ từ PDF, nhận diện heading, tạo Word ===== */
(function () {
const PS = (window.PS = window.PS || {});
const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';

PS.nfc = s => String(s).normalize('NFC');
PS.normKey = s => PS.nfc(s).replace(/\s+/g, ' ').trim().toLowerCase();
PS.stem = n => String(n).replace(/\.[^.\\/]+$/, '');
PS.esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
PS.stripVN = s => PS.nfc(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
PS.safeName = (s, n = 60) => (String(s).replace(/[\\/:*?"<>|\r\n\t]+/g, ' ').trim().replace(/^\.+|\.+$/g, '').slice(0, n).trim() || 'phan');
const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

/* ---------------- nhận diện số thứ tự ---------------- */
const PRIORITY = ['chuong', 'roman', 'muc', 'dieu', 'alpha', 'dec1', 'dec2', 'dec3', 'dec4', 'dec5'];
const STRONG = new Set(['chuong', 'muc', 'dieu']);
const SEP = '[\\s:.\\-–—]*', END = '(?![\\p{L}\\p{N}])';
const RE = {
  chuong: new RegExp('^(?:CHƯƠNG|Chương|PHẦN|Phần|CHAPTER|Chapter|PART|Part)\\s+(?:[IVXLC]+|\\d+)' + END + SEP, 'u'),
  muc: new RegExp('^(?:MỤC|Mục|SECTION|Section)\\s+(?:\\d+|[IVXLC]+)' + END + SEP, 'u'),
  dieu: new RegExp('^(?:ĐIỀU|Điều|ARTICLE|Article)\\s+\\d+[a-z]?' + END + SEP, 'u'),
  dec: /^(\d{1,3}(?:\.\d{1,3}){0,4})[.)]?\s+/,
  roman: /^((?:X{0,2})(?:IX|IV|V?I{0,3}))[.)]\s+/,
  alpha: /^[A-ZĐ][.)]\s+/u,
};
const LIST_MARK = /^(?:[•●▪■□◦\-–—+*]\s+|\(?\d{1,2}[.)]\s+|\(?[a-zđ]\)\s+)/u;
const PAGE_NO = /^(?:trang|page)?\s*\d{1,4}(?:\s*\/\s*\d{1,4})?$/i;
const LEADER = /(?:\.\s?){4,}/;

function matchNumbering(t) {
  let m;
  for (const f of ['chuong', 'muc', 'dieu']) if ((m = RE[f].exec(t))) return [f, m[0].length];
  if ((m = RE.dec.exec(t))) return ['dec' + Math.min((m[1].match(/\./g) || []).length + 1, 5), m[0].length];
  if ((m = RE.roman.exec(t)) && m[1]) return ['roman', m[0].length];
  if ((m = RE.alpha.exec(t))) return ['alpha', m[0].length];
  return [null, 0];
}
PS.matchNumbering = matchNumbering;
PS.stripLeadingNumber = t => { const [f, n] = matchNumbering(t); return f && t.slice(n).trim() ? t.slice(n).trim() : t.trim(); };

/* ---------------- phát hiện heading ---------------- */
function findNoise(lines) {
  const npages = new Set(lines.map(l => l.page)).size, cnt = new Map(), margin = [];
  lines.forEach((l, i) => {
    if (!l.page_h) return;
    if (l.y0 < 0.09 * l.page_h || l.y0 > 0.91 * l.page_h) {
      margin.push(i);
      const k = PS.normKey(l.text).replace(/\d+/g, '#');
      if (!cnt.has(k)) cnt.set(k, new Set());
      cnt.get(k).add(l.page);
    }
  });
  const need = Math.max(3, Math.floor(0.3 * npages)), noise = new Set();
  for (const i of margin) {
    const t = lines[i].text.trim(), k = PS.normKey(t).replace(/\d+/g, '#');
    if (PAGE_NO.test(t) || (npages >= 3 && cnt.get(k).size >= need)) noise.add(i);
  }
  return noise;
}
function repeatedKeys(lines) {            // dòng lặp ở ≥ nửa số trang (watermark chữ, logo chữ…) — chỉ loại khỏi ứng viên heading
  const pages = new Set(lines.map(l => l.page)).size, all = new Map(), out = new Set();
  if (pages < 3) return out;
  lines.forEach(l => { const k = PS.normKey(l.text); if (k.length > 2) { if (!all.has(k)) all.set(k, new Set()); all.get(k).add(l.page); } });
  const half = Math.max(3, Math.ceil(0.5 * pages));
  for (const [k, v] of all) if (v.size >= half) out.add(k);
  return out;
}
function bodySize(lines, noise) {
  const c = new Map();
  lines.forEach((l, i) => { if (!noise.has(i)) { const k = Math.round(l.size * 2) / 2; c.set(k, (c.get(k) || 0) + l.text.length); } });
  let best = null, bv = -1;
  for (const [k, v] of c) if (v > bv) { best = k; bv = v; }
  return best;
}
function makeSegments(lines, noise) {
  const segs = []; let cur = null;
  lines.forEach((l, i) => {
    if (noise.has(i)) { cur = null; return; }
    const t = PS.nfc(l.text).trim(); if (!t) return;
    const same = cur && cur.page === l.page && cur.block === l.block && Math.abs(cur.size - l.size) <= 0.6 &&
      cur.bold === l.bold && !LIST_MARK.test(t) && !(l.newPara);
    if (same) { cur.text += ' ' + t; cur.nlines++; cur.size = Math.max(cur.size, l.size); }
    else { cur = { page: l.page, block: l.block, y0: l.y0, x0: l.x0 || 0, text: t, size: l.size, bold: l.bold, nlines: 1, block_nsegs: 1,
      fam: null, cand: false, bigger: false, level: null, kind: 'body', merged: false }; segs.push(cur); }
  });
  const pb = new Map();
  segs.forEach(s => { const k = s.page + ':' + s.block; pb.set(k, (pb.get(k) || 0) + 1); });
  segs.forEach(s => (s.block_nsegs = pb.get(s.page + ':' + s.block)));
  return segs;
}
const isCaps = t => { const L = [...t].filter(c => /\p{L}/u.test(c)); return L.length >= 4 && L.every(c => c === c.toUpperCase() && c !== c.toLowerCase()); };
function judge(s, body) {
  const t = s.text.trim(), n = t.length;
  s.fam = matchNumbering(t)[0];
  s.bigger = s.size >= body + Math.max(1.0, body * 0.08);
  const caps = isCaps(t), styleOk = s.bigger || s.bold || caps;
  if (n < 2 || n > 160 || LEADER.test(t) || ',;'.includes(t[n - 1])) { s.cand = false; return; }
  if (STRONG.has(s.fam)) s.cand = n <= 120 && (styleOk || n <= 80);
  else if (s.fam) s.cand = !!(styleOk && n <= 120 && (!t.endsWith('.') || s.bigger || s.bold));
  else if (s.bigger) s.cand = s.nlines <= 3 && !t.endsWith('.');
  else if (s.bold || caps) {
    const digits = [...t].filter(c => c >= '0' && c <= '9').length;
    s.cand = n <= 100 && s.nlines <= 2 && s.block_nsegs === 1 && s.size >= body - 0.5 && !/[.:,]$/.test(t) && digits <= n * 0.4;
  } else s.cand = false;
}
function cluster(sizes, tol = 0.6) {
  const out = new Map(), reps = [];
  [...new Set(sizes)].sort((a, b) => b - a).forEach(sz => {
    if (!reps.length || reps[reps.length - 1] - sz > tol) reps.push(sz);
    out.set(sz, reps.length - 1);
  });
  return out;
}
PS.normalizeLevels = function (entries) {
  let prev = 0;
  return entries.map(e => { const l = Math.max(1, Math.min(+e.level, prev + 1)); prev = l; return Object.assign({}, e, { level: l }); });
};

PS.detectHeadings = function (lines, maxLevel = 4) {
  if (!lines.length) return { segs: [], headings: [] };
  const noise = findNoise(lines), body = bodySize(lines, noise);
  if (body == null) return { segs: [], headings: [] };
  let segs = makeSegments(lines, noise);
  const rep = repeatedKeys(lines);
  segs = segs.filter(s => !(rep.has(PS.normKey(s.text)) && s.size >= body * 1.4));   // chữ to lặp mọi trang = watermark/logo
  segs.forEach(s => { judge(s, body); if (rep.has(PS.normKey(s.text))) s.cand = false; });
  for (let i = 0; i + 1 < segs.length; i++) {         // "CHƯƠNG I" + tên chương ở dòng kế
    const a = segs[i], b = segs[i + 1];
    if (a.cand && (a.fam === 'chuong' || a.fam === 'muc') && b.cand && !b.fam && a.page === b.page && b.nlines <= 2 &&
        PS.stripLeadingNumber(a.text) === a.text.trim() && b.y0 - a.y0 < 3 * Math.max(a.size, 10)) {
      a.text = a.text.trim() + ' ' + b.text.trim(); b.cand = false; b.merged = true;
    }
  }
  segs = segs.filter(s => !s.merged);
  let cands = segs.filter(s => s.cand);
  const famCount = new Map();
  cands.forEach(s => s.fam && famCount.set(s.fam, (famCount.get(s.fam) || 0) + 1));
  const use = [];
  for (const f of PRIORITY) {
    const c = famCount.get(f) || 0;
    const parentOk = f.startsWith('dec') && f !== 'dec1' && use.includes('dec' + (+f.slice(3) - 1));
    if (c >= (STRONG.has(f) || parentOk ? 1 : 2)) use.push(f);
  }
  const famLevel = {}, famSize = {};
  use.forEach((f, i) => { famLevel[f] = i + 1; famSize[f] = median(cands.filter(s => s.fam === f).map(s => s.size)); });
  cands.forEach(s => { if (s.fam && !(s.fam in famLevel)) { s.fam = null; if (!(s.bigger || s.bold || isCaps(s.text))) s.cand = false; } });
  cands = segs.filter(s => s.cand);
  let sty = cands.filter(s => !s.fam);
  const firstPage = Math.min(...segs.map(s => s.page));
  if (sty.length) {                                       // tiêu đề văn bản
    const top = Math.max(...sty.map(s => s.size)), tops = sty.filter(s => Math.abs(s.size - top) <= 0.6);
    const rest = cands.filter(s => !tops.includes(s)).map(s => s.size);
    const clear = rest.length ? rest.every(x => top - x >= 1.5) : true;
    if (tops.length === 1 && tops[0].page === firstPage && top >= body * 1.3 && clear) {
      tops[0].level = 0; tops[0].kind = 'title'; sty = sty.filter(s => s !== tops[0]);
    }
  }
  cands.forEach(s => { if (s.fam && famLevel[s.fam]) { s.level = famLevel[s.fam]; s.kind = 'numbered'; } });
  if (sty.length) {
    if (!use.length) {
      const keyed = new Map(sty.map(s => [s, s.bigger ? s.size : -1]));
      const cl = cluster([...keyed.values()].filter(v => v > 0)), ncl = new Set(cl.values()).size;
      sty.forEach(s => { const k = keyed.get(s); s.level = k > 0 ? cl.get(k) + 1 : ncl + 1; s.kind = 'style'; });
    } else {
      const topFam = Math.max(...Object.values(famSize));
      sty.forEach(s => {
        if (s.size > topFam + 0.6) s.level = 1;
        else { let best = null, bd = 1e9; for (const f of use) { const d = Math.abs(s.size - famSize[f]) - famLevel[f] * 1e-6; if (d < bd) { bd = d; best = f; } } s.level = famLevel[best]; }
        s.kind = 'style';
      });
    }
  }
  let prev = 0;
  segs.forEach(s => { if (s.level == null || s.level === 0) return; s.level = Math.max(1, Math.min(s.level, maxLevel, prev + 1)); prev = s.level; });
  segs.forEach(s => { if (s.level == null) s.kind = 'body'; });
  const headings = segs.filter(s => s.level != null).map(s => ({ level: s.level, title: s.text.trim(), orig: s.text.trim(), page: s.page, y: Math.round(s.y0 * 10) / 10, kind: s.kind }));
  return { segs, headings };
};

/* áp danh sách heading đã chỉnh; trả về số dòng khớp */
PS.applyOverrides = function (segs, edited) {
  const want = new Map(edited.map(h => [h.page + '|' + PS.normKey(h.orig || h.title), h]));
  let matched = 0;
  segs.forEach(s => {
    const h = want.get(s.page + '|' + PS.normKey(s.text));
    if (h) { s.level = +h.level; s.kind = s.level === 0 ? 'title' : 'edited'; s.text = h.title; matched++; }
    else { s.level = null; s.kind = 'body'; }
  });
  return matched;
};

/* ---------------- trích xuất dòng chữ từ PDF bằng pdf.js ---------------- */
PS.getPdfjs = async function () {
  if (PS._pdfjs) return PS._pdfjs;
  const base = PS.CDN.pdfjs;
  const lib = await import(base + 'pdf.min.mjs');
  const code = await (await fetch(base + 'pdf.worker.min.mjs')).text();
  lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
  return (PS._pdfjs = lib);
};

      h('button', { class: 'ico', title: 'Bỏ', onclick: () => { list.splice(i, 1); paint(); tool.onFiles && tool.onFiles(list); } }, '✕'))));
  };
  const add = async fl => {
    const arr = [...fl].filter(f => new RegExp('(' + tool.accept.split(',').map(s => s.trim().replace('.', '\\.')).join('|') + ')$', 'i').test(f.name));
    if (!arr.length) { status('Không có file đúng định dạng (' + tool.accept + ')'); return; }
    if (!tool.multi) list.length = 0;
    for (const f of arr) list.push({ name: f.name, bytes: await readBytes(f) });
    paint(); status(''); tool.onFiles && tool.onFiles(list);
  };
  const input = h('input', { type: 'file', accept: tool.accept, multiple: !!tool.multi, onchange: () => { add(input.files); input.value = ''; } });
  const drop = h('div', { class: 'drop', onclick: () => input.click() }, tool.multi ? 'Bấm hoặc kéo thả nhiều file vào đây' : 'Bấm hoặc kéo thả file vào đây', h('small', {}, tool.accept));
  ['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => add(e.dataTransfer.files));
  input.style.display = 'none'; host.append(drop, input, listEl);
  return { list, add };
}

/* ---------- outline có sẵn ---------- */
PS.readOutline = async function (bytes, pw) {
  const pdf = await PS.openPdfjs(bytes, pw), out = [];
  const walk = async (items, lvl) => { for (const it of items || []) { let page = 0; try { const d = typeof it.dest === 'string' ? await pdf.getDestination(it.dest) : it.dest; if (d) page = (await pdf.getPageIndex(d[0])) + 1; } catch (e) { /* */ } if (page) out.push({ level: lvl, title: it.title.trim(), orig: it.title.trim(), page, y: 0, kind: 'bookmark' }); await walk(it.items, lvl + 1); } };
  await walk(await pdf.getOutline(), 1); return out;
};

  const box = h('div', { class: 'scan' }); ctx.extra.append(box); let scanned = null, cands = [];
  const scan = () => ctx.run(async rc => {
    const f = rc.files[0]; if (!f) throw new Error('Chưa chọn file PDF');
    status('Đang quét…', 0.3); const s = await PS.scanWatermarks(f.bytes, rc.pw); scanned = f; cands = s.candidates;
    box.innerHTML = '';
    box.append(h('p', {}, `${s.pages} trang · watermark gắn nhãn chuẩn: ${s.tagged} · lớp Watermark: ${s.layers} · chú thích Watermark: ${s.annots}`));
    if (cands.length) {
      box.append(h('p', { class: 'hint' }, 'Ảnh/đối tượng lặp ở nhiều trang (có thể là watermark hoặc logo) — tick để xóa:'));
      cands.forEach(c => { const ck = h('input', { type: 'checkbox' }); c.ck = ck; box.append(h('label', { class: 'chk' }, ck, `${c.type === 'Image' ? 'Ảnh' : 'Form'} ${c.w ? c.w + '×' + c.h : ''} — xuất hiện ở ${c.pages}/${s.pages} trang`)); });
    } else box.append(h('p', { class: 'hint' }, 'Không thấy ảnh/đối tượng lặp. Nếu watermark là chữ, nhập nội dung chữ ở trên rồi bấm Xóa.'));
    if (!s.tagged && !s.layers && !s.annots && !cands.length) rc.note('Không phát hiện watermark theo cách chuẩn. Có thể thử nhập chữ watermark để xóa theo nội dung.');
  });
  const go = () => ctx.run(async rc => rc.each(async f => {
    const o = rc.o; let xobjs = f === scanned ? cands.filter(c => c.ck && c.ck.checked).map(c => c.id) : [];
    if (o.auto) { const s = await PS.scanWatermarks(f.bytes, rc.pw); xobjs = xobjs.concat(s.candidates.map(c => c.id)); }
    const r = await PS.removeWatermarks(f.bytes, { pw: rc.pw, marked: o.marked, annots: o.annots, text: o.text, xobjs, pages: o.pages }), st = r.stat, total = st.marked + st.text + st.xobj + st.annots;
    if (!total) throw new Error('Không tìm thấy watermark phù hợp (có thể đã nằm trong ảnh nền hoặc font mã hóa nên không khớp chữ). Hãy quét và chọn ảnh lặp, hoặc nhập đúng chữ watermark.');
    rc.add(PS.stem(f.name) + '_xoawm.pdf', r.bytes, 'application/pdf', `đã gỡ: ${st.marked} nhãn chuẩn, ${st.text} khối chữ, ${st.xobj} ảnh/đối tượng, ${st.annots} chú thích`);
  }));
  ctx.bar.append(h('button', { class: 'sec', onclick: scan }, 'Quét watermark (file đầu tiên)'), h('button', { class: 'act', onclick: go }, 'Xóa watermark'));
};
})();

document.addEventListener('DOMContentLoaded', function () { PS.startUI(); });
</script>
</body>
